<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC26 - Manager Career</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Music -->
    <audio id="background-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Control Button -->
    <div class="music-control">
        <button id="music-btn" class="music-toggle">🎵</button>
    </div>

    <div class="container">
        <!-- Left Sidebar Menu -->
        <div class="sidebar">
            <div class="logo">FC 26</div>
            <nav class="menu">
                <div class="menu-item" data-menu="manager-career">
                    <span>MANAGER CAREER</span>
                </div>
                <div class="menu-item" data-menu="pro-clubs">
                    <span>PRO CLUBS</span>
                </div>
                <div class="menu-item" data-menu="ultimate-team">
                    <span>ULTIMATE TEAM</span>
                </div>
                <div class="menu-item" data-menu="player-career">
                    <span>PLAYER CAREER</span>
                </div>
                <div class="menu-item" data-menu="clubs">
                    <span>CLUBS</span>
                </div>
                <div class="menu-item" data-menu="kick-off">
                    <span>KICK OFF</span>
                </div>
                <div class="menu-item" data-menu="learn-to-play">
                    <span>LEARN TO PLAY</span>
                </div>
            </nav>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="background" id="background"></div>
            <div class="player-image" id="player-image"></div>
            
            <div class="content-box">
                <h2 id="main-title">Manager Career</h2>
                <p id="main-description">Are you ready to lead a club straight off the pitch?</p>
                <p id="main-subtitle">Adapt a philosophy | Design the future | Compete around the world</p>
                <button class="play-button" id="play-btn">► EXPAND MANAGER CAREER</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
